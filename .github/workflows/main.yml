name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create debug.keystore
      run: |
        if [ ! -f debug.keystore ]; then
          echo "Generating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Configure google-services.json for PikaFit
      run: |
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "pikafit-hunter",
            "storage_bucket": "pikafit-hunter.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                "android_client_info": {
                  "package_name": "com.aistudio.huntersystem.kxmpzq"
                }
              },
              "oauth_client": [
                {
                  "client_id": "dummy-web-client-id.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "dummy_api_key"
                }
              ],
              "services": {}
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef0123456780",
                "android_client_info": {
                  "package_name": "com.example"
                }
              },
              "oauth_client": [
                {
                  "client_id": "dummy-web-client-id.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "dummy_api_key"
                }
              ],
              "services": {}
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PikaFit-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
