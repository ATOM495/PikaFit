name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew not found. Generating wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Restore Signing Keystore
      run: |
        if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from debug.keystore.base64 for Google Sign-In certificate matching..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PikaFit-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
