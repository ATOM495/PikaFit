name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Signing Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          echo "Restoring debug.keystore from debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f debug.keystore ]; then
          echo "Fallback: generating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Ensure google-services.json
      run: |
        if [ ! -f app/google-services.json ]; then
          echo "Notice: app/google-services.json not found in repository. Auto-generating production configuration..."
          mkdir -p app
          cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "614630545372",
    "project_id": "gen-lang-client-0657010658",
    "storage_bucket": "gen-lang-client-0657010658.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:614630545372:android:cac82cb2ae97306291a119",
        "android_client_info": {
          "package_name": "com.aistudio.huntersystem.kxmpzq"
        }
      },
      "oauth_client": [
        {
          "client_id": "614630545372-tblcssh5p7u9ktfbbtdo0btrut96arj5.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.huntersystem.kxmpzq",
            "certificate_hash": "1416919a5ce76c3156a524c9dea5dd8efdcdd124"
          }
        },
        {
          "client_id": "614630545372-3gci1lf8jgkm09bajjmk2fk2cp6808gs.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyBfcVdHybmn3TkU1CGpt40ztEGpUFT3pP8"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "614630545372-3gci1lf8jgkm09bajjmk2fk2cp6808gs.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
        fi
        echo "app/google-services.json ready."

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PikaFit-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
